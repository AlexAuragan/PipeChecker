<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PipeChecker{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <style>
    /* ── reset ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── tokens ─────────────────────────────────────────────────── */
    :root {
      --bg:          #f0f2ff;
      --surface:     #ffffff;
      --ink:         #12133a;
      --ink-mid:     #4a4c72;
      --ink-light:   #9496be;
      --accent:      #4361ee;
      --accent-2:    #7209b7;
      --accent-bg:   #eef0ff;
      --border:      #dddff5;

      /* hand-drawn shadow layers */
      --sh-accent:   3px 3px 0 #c7caff;
      --sh-accent-lg:5px 5px 0 #c7caff;
      --sh-ink:      3px 3px 0 #12133a;
      --sh-soft:     4px 6px 18px rgba(67,97,238,.12);

      /* status */
      --g:  #16a34a;  --g-bg: #f0fdf4;  --g-sh: #bbf7d0;
      --r:  #dc2626;  --r-bg: #fff1f2;  --r-sh: #fecaca;
      --o:  #ea580c;  --o-bg: #fff7ed;  --o-sh: #fed7aa;
      --b:  #2563eb;  --b-bg: #eff6ff;  --b-sh: #bfdbfe;
      --gr: #64748b;  --gr-bg:#f8fafc;  --gr-sh:#e2e8f0;
    }

    /* ── hand-drawn border-radius helpers ───────────────────────── */
    /* Source - https://stackoverflow.com/a/53393945 (Silveri, CC BY-SA 4.0) */
    .sketchy   { border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; }
    .sketchy-b { border-radius: 15px 255px 15px 225px / 225px 15px 255px 15px; }
    .sketchy-c { border-radius: 225px 15px 15px 255px / 15px 255px 225px 15px; }
    .sketchy-d { border-radius: 15px 225px 255px 15px / 255px 15px 15px 225px; }

    /* ── base ───────────────────────────────────────────────────── */
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── nav ────────────────────────────────────────────────────── */
    nav {
      background: var(--surface);
      border-bottom: 2.5px solid var(--ink);
      box-shadow: 0 3px 0 var(--accent);
      padding: 12px 36px;
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .logo {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .14em;
      text-decoration: none;
      color: var(--accent);
      font-family: 'Courier New', monospace;
    }
    nav a { color: var(--ink-mid); text-decoration: none; font-size: 13px; font-weight: 500; }
    nav a:hover { color: var(--accent); }

    /* ── layout ─────────────────────────────────────────────────── */
    main { max-width: 1500px; margin: 0 auto; padding: 40px 36px; }
    .section { margin-bottom: 52px; }

    /* ── typography ─────────────────────────────────────────────── */
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .02em;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    h2 {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: var(--ink-mid);
      margin-bottom: 16px;
    }
    h3 { font-size: 12px; font-weight: 600; color: var(--ink-mid); margin: 14px 0 6px; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── badges ─────────────────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 99px;
      border: 1.5px solid;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .badge-green   { border-color: var(--g);  color: var(--g);  background: var(--g-bg); }
    .badge-red     { border-color: var(--r);  color: var(--r);  background: var(--r-bg); }
    .badge-orange  { border-color: var(--o);  color: var(--o);  background: var(--o-bg); }
    .badge-blue    { border-color: var(--b);  color: var(--b);  background: var(--b-bg); }
    .badge-gray    { border-color: var(--gr); color: var(--gr); background: var(--gr-bg); }
    .badge-purple  { border-color: #7c3aed;  color: #7c3aed;  background: #faf5ff; }
    .badge-crashed { border-color: #7c3aed;  color: #7c3aed;  background: #faf5ff; }

    /* ── table ──────────────────────────────────────────────────── */
    .table-wrap {
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      box-shadow: var(--sh-accent);
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 16px; text-align: left; border-bottom: 1px solid var(--border); }
    th {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--ink-mid);
      background: var(--accent-bg);
      border-bottom: 2px solid var(--ink);
    }
    tbody tr:hover td { background: var(--accent-bg); }
    tbody tr:last-child td { border-bottom: none; }

    /* ── buttons ────────────────────────────────────────────────── */
    /* Source - https://stackoverflow.com/a/53393945 (Silveri, CC BY-SA 4.0) */
    button, .btn {
      display: inline-block;
      background: var(--ink);
      color: var(--surface);
      border: 2.5px solid var(--ink);
      padding: 7px 20px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      cursor: pointer;
      border-top-left-radius:     255px 15px;
      border-top-right-radius:    15px 225px;
      border-bottom-right-radius: 225px 15px;
      border-bottom-left-radius:  15px 255px;
      box-shadow: var(--sh-accent);
      transition: box-shadow .12s, transform .12s;
    }
    button:hover, .btn:hover {
      box-shadow: var(--sh-accent-lg);
      transform: translate(-1px, -1px);
    }
    button:active, .btn:active {
      box-shadow: 1px 1px 0 #c7caff;
      transform: translate(1px, 1px);
    }
    .btn-sm { padding: 4px 14px; font-size: 11px; }
    .btn-danger {
      background: var(--r);
      border-color: var(--r);
      box-shadow: 3px 3px 0 var(--r-sh);
    }
    .btn-danger:hover { box-shadow: 5px 5px 0 var(--r-sh); }

    /* ── info grid ──────────────────────────────────────────────── */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 16px 28px;
      margin-bottom: 28px;
    }
    .info-item label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: var(--ink-light);
      margin-bottom: 4px;
    }
    .info-item span { font-size: 14px; font-weight: 500; }

    /* ── graph panel ────────────────────────────────────────────── */
    svg.arrows path { transition: opacity .15s; }
    .graph-outer {
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: 20px;
      padding: 32px 28px;
      overflow-x: auto;
      margin: 12px 0 24px;
      box-shadow: var(--sh-soft);
    }
    .graph-container {
      position: relative;
      display: flex;
      flex-direction: row;
      gap: 80px;
      align-items: flex-start;
      width: max-content;
      min-width: 100%;
    }
    .graph-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .graph-col-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: var(--ink-light);
      text-align: center;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1.5px solid var(--border);
    }

    /* ── step nodes ─────────────────────────────────────────────── */
    .step-node {
      width: 200px;
      background: var(--surface);
      border: 2px solid var(--ink);
      padding: 12px 14px;
      border-top-left-radius:     255px 15px;
      border-top-right-radius:    15px 225px;
      border-bottom-right-radius: 225px 15px;
      border-bottom-left-radius:  15px 255px;
      box-shadow: var(--sh-accent);
      transition: box-shadow .12s, transform .12s;
    }
    .step-node:hover {
      box-shadow: var(--sh-accent-lg);
      transform: translate(-1px, -1px);
    }
    .step-node-id {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
      font-family: 'Courier New', monospace;
    }
    .step-node-cmd {
      font-size: 10px;
      color: var(--ink-mid);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'Courier New', monospace;
    }
    .step-node-status {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1.5px solid var(--border);
    }

    /* status variants */
    .status-green    { border-color: var(--g); background: var(--g-bg); box-shadow: 3px 3px 0 var(--g-sh); }
    .status-red      { border-color: var(--r); background: var(--r-bg); box-shadow: 3px 3px 0 var(--r-sh); }
    .status-orange   { border-color: var(--o); background: var(--o-bg); box-shadow: 3px 3px 0 var(--o-sh); }
    .status-running  { border-color: var(--b); background: var(--b-bg); box-shadow: 3px 3px 0 var(--b-sh); }
    .status-installed{ border-color: #7c3aed; background: #faf5ff;     box-shadow: 3px 3px 0 #e9d5ff; }
    .status-skipped  { border: 2px dashed var(--gr); background: var(--gr-bg); opacity: .65; box-shadow: none; }
    .status-pending  { border-color: var(--border); box-shadow: 2px 2px 0 var(--border); }

    .status-green     .step-node-status { color: var(--g); }
    .status-red       .step-node-status { color: var(--r); }
    .status-orange    .step-node-status { color: var(--o); }
    .status-running   .step-node-status { color: var(--b); }
    .status-installed .step-node-status { color: #7c3aed; }
    .status-skipped .step-node-status, .status-pending .step-node-status { color: var(--ink-light); }

    /* ── step nodes — clickable ─────────────────────────────────── */
    .step-node { cursor: pointer; }
    .step-node-selected {
      outline: 2.5px solid var(--accent);
      outline-offset: 2px;
    }

    /* ── step detail panel ──────────────────────────────────────── */
    .step-detail-panel {
      background: var(--surface);
      border: 2px solid var(--ink);
      border-top: none;
      border-radius: 0 0 16px 16px;
      padding: 20px 24px 20px;
      margin: -12px 0 24px;
      position: relative;
    }
    .step-detail-panel .detail-close {
      position: absolute;
      top: 10px; right: 12px;
      background: none; border: none;
      font-size: 13px; cursor: pointer;
      color: var(--ink-light); padding: 2px 6px; line-height: 1;
    }
    .step-detail-panel .detail-close:hover { color: var(--ink); }
    .step-detail-panel h3 {
      margin: 16px 0 6px;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .12em;
      color: var(--ink-mid);
    }

    /* ── step tooltip popover ───────────────────────────────────── */
    #step-tooltip {
      position: fixed;
      background: var(--surface);
      border: 2px solid var(--ink);
      border-radius: 16px;
      box-shadow: var(--sh-soft);
      padding: 10px 13px;
      min-width: 160px;
      max-width: 240px;
      pointer-events: none;
      z-index: 9999;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .1s, transform .1s;
    }
    #step-tooltip.visible { opacity: 1; transform: translateY(0); }

    .tip-id  { font-size: 12px; font-weight: 700; font-family: 'Courier New', monospace;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
    .tip-cmd { font-size: 10px; color: var(--ink-mid); font-family: 'Courier New', monospace;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 7px; }
    .tip-foot { display: flex; align-items: center; gap: 7px;
                padding-top: 6px; border-top: 1.5px solid var(--border); font-size: 11px; }
    .tip-stdout {
      margin: 7px 0 6px;
      font-size: 10px; font-family: 'Courier New', monospace;
      color: var(--ink-mid);
      white-space: pre-wrap; word-break: break-all;
      max-height: 80px; overflow: hidden;
      border-left: 2px solid var(--border);
      padding-left: 7px;
    }

    pre {
      background: var(--ink);
      color: #c7caff;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-x: auto;
      margin-top: 6px;
    }

    code {
      background: var(--accent-bg);
      color: var(--accent);
      padding: 2px 7px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      font-weight: 600;
    }

    /* ── target section ─────────────────────────────────────────── */
    .target-section {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 20px 24px;
      margin-bottom: 16px;
      box-shadow: var(--sh-soft);
      transition: border-color .2s;
    }
    .target-section:hover { border-color: var(--ink-light); }
    .target-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .target-header strong { font-size: 15px; font-weight: 700; }

    /* ── filter tabs (pure CSS, radio-based) ─────────────────────── */
    .filter-block { margin-bottom: 28px; }
    .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .ftab {
      padding: 6px 18px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: 2px solid var(--ink);
      background: var(--surface);
      color: var(--ink-mid);
      letter-spacing: .04em;
      border-top-left-radius:     255px 15px;
      border-top-right-radius:    15px 225px;
      border-bottom-right-radius: 225px 15px;
      border-bottom-left-radius:  15px 255px;
      box-shadow: 2px 2px 0 var(--border);
      transition: box-shadow .12s, transform .12s, background .12s;
    }
    .ftab:hover:not(.ftab-zero) {
      color: var(--ink);
      box-shadow: 4px 4px 0 var(--accent);
      transform: translate(-1px, -1px);
    }
    .ftab-zero { opacity: .3; pointer-events: none; border-style: dashed; }

    /* active tab */
    #tf-all:checked     ~ .filter-bar label[for="tf-all"],
    #tf-green:checked   ~ .filter-bar label[for="tf-green"],
    #tf-update:checked  ~ .filter-bar label[for="tf-update"],
    #tf-warning:checked ~ .filter-bar label[for="tf-warning"],
    #tf-orange:checked  ~ .filter-bar label[for="tf-orange"],
    #tf-red:checked     ~ .filter-bar label[for="tf-red"] {
      background: var(--ink);
      color: var(--surface);
      box-shadow: 3px 3px 0 var(--accent);
      transform: translate(-1px, -1px);
    }

    /* filter visibility */
    #tf-green:checked   ~ .targets-list .target-section:not(.ts-green)      { display: none; }
    #tf-update:checked  ~ .targets-list .target-section:not(.ts-s-update)   { display: none; }
    #tf-warning:checked ~ .targets-list .target-section:not(.ts-s-warning)  { display: none; }
    #tf-orange:checked  ~ .targets-list .target-section:not(.ts-orange)     { display: none; }
    #tf-red:checked     ~ .targets-list .target-section:not(.ts-red)        { display: none; }

    /* ── breadcrumb ─────────────────────────────────────────────── */
    .breadcrumb { font-size: 12px; color: var(--ink-light); margin-bottom: 24px; }
    .breadcrumb a { color: var(--ink-light); }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb span { margin: 0 6px; }

    /* ── empty state ────────────────────────────────────────────── */
    .empty {
      color: var(--ink-light);
      font-size: 13px;
      padding: 36px;
      text-align: center;
      border: 2px dashed var(--border);
      border-radius: 20px;
      background: var(--surface);
    }

    /* ── forms ──────────────────────────────────────────────────── */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px 28px;
      margin-bottom: 28px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group > label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: var(--ink-light);
    }
    input[type="text"], select, textarea {
      border: 2px solid var(--ink);
      background: var(--surface);
      color: var(--ink);
      padding: 8px 12px;
      font-family: inherit;
      font-size: 13px;
      width: 100%;
      border-top-left-radius:     255px 10px;
      border-top-right-radius:    10px 200px;
      border-bottom-right-radius: 200px 10px;
      border-bottom-left-radius:  10px 200px;
      outline: none;
      box-shadow: var(--sh-accent);
      transition: box-shadow .12s;
    }
    input[type="text"]:focus, select:focus, textarea:focus {
      box-shadow: var(--sh-accent-lg);
    }
    input[type="text"]:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 4px; }
    .checkbox-item  { display: flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; }
    .checkbox-item input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; }
    .step-row {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: var(--sh-soft);
    }
    .step-row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .step-row-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--ink-mid);
    }
    .btn-remove {
      background: transparent;
      color: var(--r);
      border-color: var(--r-sh);
      box-shadow: 2px 2px 0 var(--r-sh);
      font-size: 11px;
      padding: 3px 12px;
    }
    .btn-remove:hover { border-color: var(--r); box-shadow: 3px 3px 0 var(--r-sh); }
    .error-box {
      background: var(--r-bg);
      border: 2px solid var(--r);
      border-radius: 12px;
      padding: 14px 18px;
      color: var(--r);
      font-size: 13px;
      margin: 20px 0;
      line-height: 1.8;
    }
    .hint { font-size: 10px; color: var(--ink-light); margin-top: 3px; }
    .config-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .config-row input { flex: 1; }
    /* ── confirm dialog ─────────────────────────────────────────── */
    .confirm-dialog {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      border: 2.5px solid var(--ink);
      border-radius: 20px;
      padding: 28px 32px;
      max-width: 420px;
      width: 90vw;
      box-shadow: 6px 6px 0 var(--r-sh);
      background: var(--surface);
    }
    .confirm-dialog::backdrop {
      background: rgba(18, 19, 58, 0.45);
      backdrop-filter: blur(2px);
    }

  </style>
  {% block extra_styles %}{% endblock %}
</head>
<body>
  <nav>
    <a href="/" class="logo">PIPECHECKER</a>
    <a href="/">Pipelines</a>
    <a href="/connector">Connectors</a>
    <a href="/script">Scripts</a>
    <a href="/alert">Alerts</a>
    <a href="/alert-connector">Alert Connectors</a>
    <form method="post" action="/logout" style="margin-left:auto">
      <button type="submit" style="background:transparent;border:1.5px solid var(--border);color:var(--ink-light);padding:4px 14px;font-size:11px;box-shadow:none;font-weight:600;letter-spacing:.04em">
        Logout
      </button>
    </form>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>

  <dialog id="server-loading-dialog" class="confirm-dialog">
    <p style="font-weight:700; font-size:15px; margin-bottom:8px">Server is loading</p>
    <p style="color:var(--ink-mid); font-size:13px; margin-bottom:24px">
      PipeChecker is still initialising connectors. Wait a moment, then try again.
    </p>
    <div style="display:flex; justify-content:flex-end">
      <button type="button" class="btn-sm" onclick="document.getElementById('server-loading-dialog').close()">OK</button>
    </div>
  </dialog>

  <script>
  // ── graph arrows ──────────────────────────────────────────────────────────
  function drawGraphs() {
    document.querySelectorAll('.graph-container').forEach(container => {
      container.querySelectorAll('svg.arrows').forEach(s => s.remove());

      const edges = JSON.parse(container.dataset.edges || '[]');

      // ── branch-offset layout ────────────────────────────────────────────
      // Each node's y is derived from its incoming edges: branch 0 = same
      // level as predecessor, branch N = N * BRANCH_STEP px below it.
      // This naturally separates "success path" (branch 0) from "fallback
      // path" (branch 1+), so long-range arrows don't cut through unrelated cards.
      const BRANCH_STEP = 150;
      const NODE_GAP    = 20;

      const incomingByNode = {};
      edges.forEach(e => {
        (incomingByNode[e.to] = incomingByNode[e.to] || []).push(e);
      });

      const nodeY = {};
      [...container.querySelectorAll('.graph-column')].forEach(col => {
        const nodes = [...col.querySelectorAll('.step-node')];
        if (!nodes.length) return;

        nodes.forEach(node => {
          const id  = node.dataset.stepId;
          const inc = incomingByNode[id] || [];
          nodeY[id] = inc.length
            ? Math.min(...inc.map(e => (nodeY[e.from] ?? 0) + e.branch * BRANCH_STEP))
            : 0;
        });

        // Sort by ideal y, then push down any card that would overlap the previous
        nodes.sort((a, b) => nodeY[a.dataset.stepId] - nodeY[b.dataset.stepId]);
        let cursor = 0;
        nodes.forEach(node => {
          const id = node.dataset.stepId;
          nodeY[id] = Math.max(nodeY[id], cursor);
          cursor = nodeY[id] + node.offsetHeight + NODE_GAP;
        });

        // Position cards absolutely within the column
        const label  = col.querySelector('.graph-col-label');
        // label.offsetHeight + margin-bottom (8px) + flex gap (20px)
        const labelH = label ? label.offsetHeight + 28 : 0;

        col.style.position = 'relative';
        col.style.width    = '200px';
        col.style.height   = (labelH + cursor - NODE_GAP) + 'px';

        nodes.forEach(node => {
          node.style.position = 'absolute';
          node.style.top      = (labelH + nodeY[node.dataset.stepId]) + 'px';
          node.style.left     = '0';
        });
      });

      if (!edges.length) return;

      // ── draw arrows ─────────────────────────────────────────────────────
      const markerId     = 'arr' + Math.random().toString(36).slice(2, 8);
      const markerIdGray = markerId + 'g';
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.classList.add('arrows');
      svg.setAttribute('aria-hidden', 'true');
      Object.assign(svg.style, {
        position: 'absolute', inset: '0',
        width: '100%', height: '100%',
        pointerEvents: 'none', overflow: 'visible',
      });

      const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      defs.innerHTML = `
        <marker id="${markerId}" markerWidth="7" markerHeight="5"
          refX="7" refY="2.5" orient="auto">
          <polygon points="0 0,7 2.5,0 5" fill="#4361ee"/>
        </marker>
        <marker id="${markerIdGray}" markerWidth="7" markerHeight="5"
          refX="7" refY="2.5" orient="auto">
          <polygon points="0 0,7 2.5,0 5" fill="#9496be"/>
        </marker>`;
      svg.appendChild(defs);
      container.prepend(svg); // prepend so arrows render behind cards

      const stepResults = JSON.parse(container.dataset.stepResults || '{}');
      const cr = container.getBoundingClientRect();

      for (const edge of edges) {
        const fromEl = container.querySelector('[data-step-id="' + CSS.escape(edge.from) + '"]');
        const toEl   = container.querySelector('[data-step-id="' + CSS.escape(edge.to)   + '"]');
        if (!fromEl || !toEl) continue;

        const sr = stepResults[edge.from];
        const used = !sr || (sr.branch === edge.branch && !sr.skipped);

        const fr = fromEl.getBoundingClientRect();
        const tr = toEl.getBoundingClientRect();

        const x1 = fr.right  - cr.left;
        const y1 = (fr.top + fr.bottom) / 2 - cr.top;
        const x2 = tr.left   - cr.left;
        const y2 = (tr.top + tr.bottom) / 2 - cr.top;
        const cx = (x2 - x1) * 0.5;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M${x1},${y1} C${x1+cx},${y1} ${x2-cx},${y2} ${x2},${y2}`);
        path.setAttribute('stroke', used ? '#4361ee' : '#9496be');
        path.setAttribute('stroke-width', used ? '2' : '1.5');
        path.setAttribute('stroke-dasharray', '6 3');
        path.setAttribute('stroke-opacity', used ? '1' : '0.4');
        path.setAttribute('fill', 'none');
        path.setAttribute('marker-end', `url(#${used ? markerId : markerIdGray})`);
        path.dataset.from = edge.from;
        path.dataset.to   = edge.to;
        path.dataset.used = used ? '1' : '0';
        svg.appendChild(path);
      }

      // Hover: dim arrows not connected to the hovered card.
      // Uses event delegation so re-renders don't stack duplicate listeners.
      if (!container.dataset.hoverSetup) {
        container.dataset.hoverSetup = '1';

        container.addEventListener('mouseover', e => {
          const node  = e.target.closest('.step-node');
          const paths = [...container.querySelectorAll('svg.arrows path')];
          if (node) {
            const id = node.dataset.stepId;
            paths.forEach(p => {
              const connected = p.dataset.from === id || p.dataset.to === id;
              p.style.opacity = connected ? (p.dataset.used === '1' ? '1' : '0.4') : '0.1';
            });
          } else {
            paths.forEach(p => { p.style.opacity = ''; });
          }
        });

        container.addEventListener('mouseleave', () => {
          container.querySelectorAll('svg.arrows path').forEach(p => { p.style.opacity = ''; });
        });
      }
    });
  }

  document.addEventListener('DOMContentLoaded', drawGraphs);
  document.addEventListener('htmx:afterSettle', drawGraphs);

  // Click outside any confirm dialog to cancel
  document.addEventListener('click', function(e) {
    if (e.target.classList.contains('confirm-dialog')) e.target.close();
  });

  // Show loading popup on 503
  document.addEventListener('htmx:responseError', function(e) {
    if (e.detail.xhr.status === 503) {
      e.detail.xhr.abort && e.detail.xhr.abort();
      document.getElementById('server-loading-dialog').showModal();
    }
  });

  // ── step node tooltip + click detail ─────────────────────────────────────
  (function () {
    const tip = document.createElement('div');
    tip.id = 'step-tooltip';
    document.body.appendChild(tip);

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function fmtDur(s) {
      if (!s && s !== 0) return '';
      if (s < 1)  return Math.round(s * 1000) + 'ms';
      if (s < 60) return s.toFixed(1) + 's';
      return Math.floor(s / 60) + 'm ' + Math.round(s % 60) + 's';
    }

    function statusLabel(sr) {
      if (!sr) return 'pending';
      if (sr.skipped)   return 'skipped';
      if (sr.is_branch) return 'branch';
      return sr.signal || 'pending';
    }

    function getStepResults(gc) {
      if (!gc) return {};
      if (!gc._stepResultsCache) gc._stepResultsCache = JSON.parse(gc.dataset.stepResults || '{}');
      return gc._stepResultsCache;
    }

    const SIGNAL_BADGE_CLS = {
      ok: 'badge-green', update: 'badge-blue', installed: 'badge-purple',
      warning: 'badge-orange', fail: 'badge-red', crashed: 'badge-crashed',
    };

    // ── tooltip ──
    let lastTipNode = null;
    document.addEventListener('mousemove', function (e) {
      const node = e.target.closest('.step-node');
      if (!node) { tip.classList.remove('visible'); lastTipNode = null; return; }

      // reposition every move, flip if near viewport edge
      const TIP_W = 240, TIP_H = 160;
      const left = (e.clientX + TIP_W + 20 < window.innerWidth)
        ? e.clientX + 14
        : e.clientX - TIP_W - 10;
      const top  = (e.clientY + TIP_H + 20 < window.innerHeight)
        ? e.clientY + 14
        : e.clientY - TIP_H - 10;
      tip.style.left = left + 'px';
      tip.style.top  = top  + 'px';

      // only rebuild HTML when node changes
      if (node === lastTipNode) { tip.classList.add('visible'); return; }
      lastTipNode = node;

      const gc  = node.closest('.graph-container');
      const all = getStepResults(gc);
      const sr  = all[node.dataset.stepId];
      const lbl = statusLabel(sr);
      const dur = sr && !sr.skipped && sr.duration ? fmtDur(sr.duration) : null;
      const badgeCls = sr && !sr.skipped ? (SIGNAL_BADGE_CLS[sr.signal] || 'badge-gray') : 'badge-gray';

      const stdout = sr && sr.stdout ? sr.stdout.slice(0, 300) + (sr.stdout.length > 300 ? '…' : '') : null;
      tip.innerHTML = `
        <div class="tip-id">${esc(node.dataset.stepId)}</div>
        <div class="tip-cmd">${esc(sr ? sr.exec || '—' : '—')}</div>
        ${stdout ? `<div class="tip-stdout">${esc(stdout)}</div>` : ''}
        <div class="tip-foot">
          <span class="badge ${badgeCls}">${esc(lbl)}</span>
          ${dur ? `<span style="color:var(--ink-light)">${esc(dur)}</span>` : ''}
        </div>`;
      tip.className = 'visible';
    });

    // ── click → detail panel ──
    document.addEventListener('click', function (e) {
      // close button inside panel
      if (e.target.closest('[data-close-panel]')) {
        const panel = e.target.closest('.step-detail-panel');
        if (panel) {
          const outer = panel.previousElementSibling; // .graph-outer
          const gc = outer && outer.querySelector('.graph-container');
          if (gc) gc.querySelectorAll('.step-node').forEach(n => n.classList.remove('step-node-selected'));
          panel.hidden = true;
          panel.dataset.activeStep = '';
        }
        return;
      }

      const node = e.target.closest('.step-node');
      if (!node) return;
      const gc    = node.closest('.graph-container');
      const outer = gc && gc.closest('.graph-outer');
      const panel = outer && outer.nextElementSibling;
      if (!panel || !panel.classList.contains('step-detail-panel')) return;

      const stepId = node.dataset.stepId;

      // toggle off if same step clicked again
      if (!panel.hidden && panel.dataset.activeStep === stepId) {
        panel.hidden = true;
        panel.dataset.activeStep = '';
        node.classList.remove('step-node-selected');
        return;
      }

      const all = getStepResults(gc);
      const sr  = all[stepId];
      gc.querySelectorAll('.step-node').forEach(n => n.classList.remove('step-node-selected'));
      node.classList.add('step-node-selected');

      if (!sr) {
        panel.innerHTML = '<p style="color:var(--ink-light);font-size:12px">No result yet for <code>' + esc(stepId) + '</code>.</p>';
        panel.dataset.activeStep = stepId;
        panel.hidden = false;
        return;
      }

      const lbl = statusLabel(sr);
      const dur = sr.skipped || !sr.duration ? '—' : fmtDur(sr.duration);

      let html = `
        <button class="detail-close" data-close-panel>✕</button>
        <div class="info-grid">
          <div class="info-item"><label>Step</label><span><code>${esc(stepId)}</code></span></div>
          <div class="info-item"><label>Status</label><span><code>${esc(lbl)}</code></span></div>
          <div class="info-item"><label>Command</label><span><code>${esc(sr.exec || '—')}</code></span></div>
          <div class="info-item"><label>Check</label><span><code>${esc(sr.check_method || '—')}</code></span></div>
          <div class="info-item"><label>Duration</label><span>${esc(dur)}</span></div>
          ${sr.branch > 0 ? `<div class="info-item"><label>Branch</label><span><code>${sr.branch}</code></span></div>` : ''}
        </div>`;

      if (sr.stdout) html += `<h3>stdout</h3><pre>${esc(sr.stdout)}</pre>`;
      if (sr.stderr) html += `<h3>stderr</h3><pre>${esc(sr.stderr)}</pre>`;
      if (!sr.stdout && !sr.stderr && !sr.skipped)
        html += `<p style="color:var(--ink-light);font-size:11px">(no output)</p>`;

      panel.innerHTML = html;
      panel.dataset.activeStep = stepId;
      panel.hidden = false;
    });
  })();
  </script>
</body>
</html>
